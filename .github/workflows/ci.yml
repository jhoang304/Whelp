name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes: the jobs read the code, run the suites and build. The
# repository default is read-only today, but that is a setting someone can
# change, and this file should not depend on it.
permissions:
  contents: read

# Actions are pinned to commit SHAs rather than the moving v4/v5 tags, which
# can be repointed at any commit -- including by someone who takes over the
# repository they live in. The trailing comment is the version each SHA was,
# and is the thing to check when bumping them.

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # One pin for the runtime: .python-version is what Render reads, and
          # what the Pipfile now agrees with.
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt holds the pinned runtime deps; pytest is the only
          # dev dependency the suite needs (see Pipfile [dev-packages]).
          pip install -r requirements.txt pytest

      - name: Run the tests
        run: pytest

      - name: Audit dependencies
        # Blocking, now that the pinned set is clean: it was 63 advisories
        # across 9 packages when this workflow was written, which is why the
        # step started out advisory. A new one is something to answer.
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt

  frontend:
    name: tsc, jest and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # CRA 4's build needs --openssl-legacy-provider, which only exists on
          # Node 17+. Modernising that toolchain is #33.
          node-version: '18'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run the tests
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
